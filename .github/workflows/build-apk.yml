name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: false

      - name: Fix gradlew permissions and line endings
        run: |
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          find android/app/build/outputs/apk/debug -name "*.apk" -exec cp {} build-output/MCQ-Answer-Pad-debug.apk \;

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MCQ-Answer-Pad-debug.apk
          path: build-output/MCQ-Answer-Pad-debug.apk
          if-no-files-found: error

      - name: Publish Direct APK Download Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: latest-apk
          name: "MCQ Answer Pad APK (Direct Download)"
          body: |
            ### 📱 MCQ Answer Pad Android APK
            Direct download for Android phone and tablet:
            - Download `MCQ-Answer-Pad-debug.apk` below directly to your device.
            - Open and tap Install!
          files: build-output/MCQ-Answer-Pad-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

