name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable and fix line endings
        run: |
          if [ -f "android/gradlew" ]; then
            echo "ANDROID_DIR=android" >> $GITHUB_ENV
            sed -i 's/\r$//' android/gradlew
            chmod +x android/gradlew
          elif [ -f "gradlew" ]; then
            echo "ANDROID_DIR=." >> $GITHUB_ENV
            sed -i 's/\r$//' gradlew
            chmod +x gradlew
          else
            echo "ERROR: Could not locate gradlew script in repository root or android/ folder"
            exit 1
          fi

      - name: Auto-accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          printf "24333f8a6377ba88d907844be6b7e45663c01a39\n89336d020797f1f18411f38562497498d2358167\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Build Android Debug APK
        run: |
          cd ${{ env.ANDROID_DIR }}
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          APK_FILE=$(find . -type f -name "*debug*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            echo "Found APK at: $APK_FILE"
            cp "$APK_FILE" build-output/MCQ-Answer-Pad-debug.apk
          else
            echo "Searching all .apk files:"
            find . -type f -name "*.apk"
            echo "ERROR: No debug APK generated by assembleDebug"
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MCQ-Answer-Pad-debug.apk
          path: build-output/MCQ-Answer-Pad-debug.apk
          if-no-files-found: error

      - name: Publish Direct APK Download Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: latest-apk
          name: "MCQ Answer Pad APK (Direct Download)"
          body: |
            ### 📱 MCQ Answer Pad Android APK
            Direct download for Android phone and tablet:
            - Download `MCQ-Answer-Pad-debug.apk` below directly to your device.
            - Open and tap Install!
          files: build-output/MCQ-Answer-Pad-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

